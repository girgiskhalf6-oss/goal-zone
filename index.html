const sec=(h,arr,fn,empty,link)=>`<section>${head(h)}${arr.length?`<div class="grid">${arr.map(fn).join('')}</div>`:`<p>${empty} <a class="lnk" href="#/${link}">${t('more')}</a></p>`}</section>`;
return `<div class="wrap"><section><div class="box"><div class="prof"><span class="bigav">${userAv(me.avatar,96)}</span><div class="grow"><h2>${esc(me.username)}</h2><p class="st">${esc(me.email||'')}</p><p>${my?`${crest(my,22)} ${esc(p(my.n))}`:t('noteam')}</p><p class="st">${t('joined')}: ${new Date(me.created_at).toLocaleDateString(L==='ar'?'ar-u-nu-latn':'en-GB',{year:'numeric',month:'long',day:'numeric'})}</p></div><div class="row"><button data-editp>${t('edit')}</button><button class="ghost" data-logout>${t('logout')}</button></div></div>
${editing?`<form class="af editf" id="fe" novalidate>${fld('username','user','text','username',`value="${esc(me.username)}" maxlength="20"`)}${avPick(me.avatar)}<div class="fld"><label for="fav_team">${t('favteam')}</label><select id="fav_team" name="fav_team">${teamOpts(me.fav_team||'')}</select></div><p class="msg" role="alert"></p><div class="row"><button type="submit">${t('saveCh')}</button><button type="button" class="ghost" data-editp>${t('cancel')}</button></div></form>`:''}</div></section>
<section>${head(t('dash'))}<div class="stats"><div class="stat"><b>${ft.length}</b>${t('favT')}</div><div class="stat"><b>${fp.length}</b>${t('favP')}</div><div class="stat"><b>${sa.length}</b>${t('savedArt')}</div><div class="stat"><b>${ls.get('best',0)}/${QUIZ.length}</b>${t('bestq')}</div></div></section>
<section>${head(t('nextm'),'matches')}${nm?matchRow(nm,0):`<p>${t('nonext')}</p>`}</section>
${sec(t('favT'),ft,teamCard,t('nofav'),'teams')}${sec(t('favP'),fp,playerCard,t('nofav'),'players')}${sec(t('savedArt'),sa,n=>newsCard(n,NEWS.indexOf(n)),t('emptyArt'),'home')}</div>`}});
const E={invalid_credentials:'eCred',email_not_confirmed:'eConf',network:'eNet',rate:'eRate',exists:'eExists',weak_password:'eWeak',username_taken:'eUser',not_configured:'cfg',no_profile:'eProf',no_session:'eSess'};
const EM=/^[^\s@]+@[^\s@]+\.[^\s@]+$/,UNR=/^[\w\u0621-\u064A]{3,20}$/;
document.addEventListener('submit',async e=>{const f=e.target;if(!f.classList.contains('af'))return;e.preventDefault();
 const msg=f.querySelector('.msg'),btn=f.querySelector('[type=submit]'),g=n=>f.elements[n]?f.elements[n].value:'',say=(k,ok)=>{msg.textContent=t(k);msg.className='msg'+(ok?' okm':'')},fail=r=>say(E[r.code]||'eGen'),busy=b=>{btn.dataset.l=btn.dataset.l||btn.textContent;btn.disabled=b;btn.textContent=b?'…':btn.dataset.l};
 if(!GZAuth.configured)return say('cfg');const id=f.id;busy(true);
 try{
  if(id==='fl'){const em=g('email').trim();if(!EM.test(em))return say('eEmail');if(!g('password'))return say('ePwEmpty');const r=await GZAuth.signIn(em,g('password'),f.elements.remember.checked);if(!r.ok)return fail(r);await loadMe();if(me){location.hash='#/profile';toast(t('welcome')+' '+me.username)}else say('eProf')}
  else if(id==='fs'){const u=g('username').trim(),em=g('email').trim(),pw=g('password');if(!UNR.test(u))return say('eUserFmt');if(!EM.test(em))return say('eEmail');if(pw.length<8)return say('eWeak');if(pw!==g('password2'))return say('ePwMatch');
   const r=await GZAuth.signUp({email:em,password:pw,username:u,avatar:g('avatar')||'a1',fav_team:g('fav_team'),remember:true});if(!r.ok)return fail(r);
   if(r.session){await loadMe();if(me){location.hash='#/profile';toast(t('welcome')+' '+me.username)}else say('eProf')}else{f.reset();say('confirmSent',1)}}
  else if(id==='ff'){const em=g('email').trim();if(!EM.test(em))return say('eEmail');const r=await GZAuth.recover(em);if(!r.ok)return fail(r);say('recoverSent',1)}
  else if(id==='fr'){const pw=g('password');if(pw.length<8)return say('eWeak');if(pw!==g('password2'))return say('ePwMatch');const r=await GZAuth.updatePassword(pw);if(!r.ok)return fail(r);await loadMe();location.hash='#/profile';toast(t('pwUpdated'))}
  else if(id==='fe'){const u=g('username').trim();if(!UNR.test(u))return say('eUserFmt');const r=await GZAuth.updateProfile({username:u,avatar:g('avatar')||'a1',fav_team:g('fav_team')||null});if(!r.ok)return fail(r);
   me=Object.assign({},me,r.data);ls.set('profile',me);ls.set('myteam',me.fav_team||'');editing=false;authUI();rerender();toast(t('savedOk'))}
 }catch(err){console.error(err);say('eGen')}finally{busy(false)}});
async function logout(){await GZAuth.signOut();me=null;editing=false;['favs','saved','myteam','profile'].forEach(k=>{try{localStorage.removeItem('gz_'+k)}catch(e){}});navUI();authUI();const same=(location.hash||'#/home')==='#/home';location.hash='#/home';toast(t('bye'));if(same)route()}
async function authHash(){const h=await GZAuth.fromHash();if(h&&h.type==='recovery')history.replaceState(null,'',location.pathname+location.search+'#/reset');else if(h)history.replaceState(null,'',location.pathname+location.search+'#/'+(h.type==='error'?'login':'profile'));if(GZAuth.session())await loadMe()}
async function boot(){ui();main.innerHTML='<div class="wrap" aria-busy="true"><div class="sk"></div><div class="sk"></div></div>';
 await authHash();if(!GZAuth.session())ls.set('profile',null);navUI();authUI();route()}

/* ---------- router ---------- */
const TITLES={home:'GOAL ZONE | Football fan hub',teams:'Teams',players:'Players',matches:'Matches',quiz:'Football Quiz',fan:'Fan Zone',search:'Search'};
function route(){upd=null;const[r,a]=(location.hash.slice(2)||'home').split('?');const f=P[r];
if(r==='profile'&&!me){location.replace('#/login');return}
if((r==='login'||r==='signup')&&me){location.replace('#/profile');return}
$('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false');
document.querySelectorAll('#nav a').forEach(x=>x.classList.toggle('on',x.dataset.r===r));
document.title=r==='home'?TITLES.home:`${t(r)} | GOAL ZONE`;
if(!f){main.innerHTML=`<div class="wrap"><section><h2>${t('nf')}</h2><a class="btn" href="#/home">${t('back')}</a></section></div>`;return}
main.innerHTML='<div class="wrap" aria-busy="true"><div class="sk"></div><div class="sk"></div></div>';
setTimeout(()=>{try{main.innerHTML=f(a?decodeURIComponent(a.replace(/^q=/,'')):'');if(upd)upd();window.scrollTo(0,0)}catch(e){console.error(e);main.innerHTML=`<div class="wrap"><section><div class="err"><p>${t('err')}</p><button data-retry>${t('retry')}</button></div></section></div>`}},220)}
function ui(){document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';$('#lang').textContent=L==='ar'?'EN':'AR';$('#lang').setAttribute('aria-label',L==='ar'?'English':'العربية');
navUI();authUI();
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));$('#q').placeholder=t('search')}
/* ---------- events ---------- */
function modal(k){if(k.startsWith('n:')){const n=NEWS.find(x=>x.id===k.slice(2)),i=NEWS.indexOf(n),on=ls.get('saved',[]).includes(n.id),d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="box"><div class="card"><span class="im">${newsArt(n,i)}</span></div><h2>${p(n.t)}</h2><span class="tag">${t('read')}</span><p>${p(n.s)}</p><div class="row"><button data-save="${n.id}" aria-pressed="${on}">${on?'★':'☆'} ${t(on?'unsave':'saveArt')}</button><button class="ghost" data-close>${t('close')}</button></div></div>`;document.body.appendChild(d);d.querySelector('button').focus();return}
const[a,id]=k.split(':');const m=a==='t'?TM(id):PLAYERS.find(x=>x.id===id);const body=a==='t'?`<div class="row">${crest(m,64)}<div><h2>${p(m.n)}</h2><span class="tag">${p(m.co)}</span><span class="tag">${p(LG[m.lg])}</span></div></div><h3>${t('ach')}</h3><p>${p(m.ach)}</p>`:`<div class="card"><span class="im">${avatar(m)}</span></div><h2>${p(m.n)}</h2><p><span class="tag">${p(POS[m.pos])}</span><span class="tag">${t('nat')}: ${p(m.nat)}</span><span class="tag">${t('team')}: ${p(TM(m.t).n)}</span></p><p>${p(m.bio)}</p><p class="st">${t('sample')}</p>`;
const d=document.createElement('div');d.className='modal';d.setAttribute('role','dialog');d.setAttribute('aria-modal','true');d.innerHTML=`<div class="box">${body}<button data-close>${t('close')}</button></div>`;document.body.appendChild(d);d.querySelector('button').focus()}
const BAD=/(http|www\.|\.com|idiot|stupid|hate|kill|غبي|حمار|كلب|اقتل)/i;
document.addEventListener('click',e=>{const x=e.target.closest('[data-logout],[data-editp],[data-save],[data-open],[data-fav],[data-ans],[data-next],[data-again],[data-vote],[data-post],[data-retry],[data-close],.modal');if(!x)return;
if(x.classList.contains('modal')&&e.target===x)return x.remove();
if(x.dataset.logout!==undefined)return logout();
if(x.dataset.editp!==undefined){editing=!editing;return rerender()}
if(x.dataset.save){if(!me)return toast(t('loginSave'),'#/login',t('login'));const k=x.dataset.save;let sv=ls.get('saved',[]);sv=sv.includes(k)?sv.filter(i=>i!==k):[...sv,k];ls.set('saved',sv);push({saved:sv});const on=sv.includes(k);x.setAttribute('aria-pressed',on);x.textContent=(x.classList.contains('fav')?'':on?'★ ':'☆ ')+(x.classList.contains('fav')?(on?'★':'☆'):t(on?'unsave':'saveArt'));x.setAttribute('aria-label',t(on?'unsave':'saveArt'));if(location.hash.startsWith('#/profile'))rerender();return}
if(x.dataset.close!==undefined)return x.closest('.modal').remove();
if(x.dataset.open){e.preventDefault();return modal(x.dataset.open)}
if(x.dataset.fav){let f=favs();const k=x.dataset.fav;f=f.includes(k)?f.filter(i=>i!==k):[...f,k];ls.set('favs',f);push({favs:f});const on=f.includes(k);x.setAttribute('aria-pressed',on);x.textContent=on?'♥':'♡';x.setAttribute('aria-label',t(on?'rem':'add'));if(location.hash.startsWith('#/fan'))rerender();return}
if(x.dataset.ans!==undefined){qz.a=+x.dataset.ans;if(qz.a===QUIZ[qz.i].a)qz.s++;return rerender()}
if(x.dataset.next!==undefined){if(qz.i===QUIZ.length-1)qz.done=true;else{qz.i++;qz.a=null}return rerender()}
if(x.dataset.again!==undefined){qz={i:0,s:0,a:null,done:false};return rerender()}
if(x.dataset.vote){const[id,i]=x.dataset.vote.split(':'),v=ls.get('votes',{}),o=POLLS.find(z=>z.id===id);v[id]=v[id]||o.o.map(()=>0);v[id][+i]++;ls.set('votes',v);return rerender()}
if(x.dataset.post!==undefined){const ta=$('#pt'),s=ta.value.trim(),m=$('#pm');if(!s){m.textContent=t('empty');return}if(BAD.test(s)){m.textContent=t('bad');return}const ps=ls.get('posts',[]);ps.unshift(s.slice(0,200));ls.set('posts',ps.slice(0,30));return rerender()}
if(x.dataset.retry!==undefined)route()});
const rerender=()=>{const y=scrollY;main.innerHTML=P[(location.hash.slice(2)||'home').split('?')[0]]();if(upd)upd();scrollTo(0,y)};
document.addEventListener('input',e=>{if(e.target.matches('[data-f]')&&upd)upd()});
document.addEventListener('change',e=>{if(e.target.id==='mt'){ls.set('myteam',e.target.value);push({fav_team:e.target.value||null});rerender()}else if(e.target.matches('[data-f]')&&upd)upd()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal').forEach(m=>m.remove())});
$('#lang').onclick=()=>{L=L==='ar'?'en':'ar';ls.set('lang',L);ui();route()};
$('#burger').onclick=()=>{const o=$('#nav').classList.toggle('open');$('#burger').setAttribute('aria-expanded',o)};
$('#nav').addEventListener('click',e=>{if(e.target.closest('a')){$('#nav').classList.remove('open');$('#burger').setAttribute('aria-expanded','false')}});
$('#sf').onsubmit=e=>{e.preventDefault();const v=$('#q').value.trim();if(v)location.hash='#/search?q='+encodeURIComponent(v)};
document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();main.focus()});
window.addEventListener('hashchange',async()=>{if(/^#(access_token|error)=/.test(location.hash))await authHash();navUI();route()});boot();
})();
